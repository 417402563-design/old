server:
  port: 8080

spring:
  # ===================== H2 内嵌数据库 =====================
  # 使用文件模式：数据保存在 backend/anti_fraud.mv.db，重启不丢
  # MODE=MySQL 开启 MySQL 语法兼容
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./anti_fraud;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  # 自动执行 schema.sql 与 data.sql 初始化数据库
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
      encoding: UTF-8
  # H2 Web 控制台：浏览器访问 http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.antifraud.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置
jwt:
  secret: AntiFraudPlatformSecretKey2024VeryLongSecretForJWTSigning
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

file:
  upload-path: ./uploads/
